# Server stack. The Makefile adds compose.proxy.yaml when .env sets PROXY_NETWORK.
# Local development stays on XAMPP; there is no dev override.
services:
  nginx:
    build:
      context: .
      target: web
    image: mongkol-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage/app:ro
    depends_on:
      - app

  app:
    build:
      context: .
      target: app
    image: mongkol-app
    env_file: .env
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-${DB_PASSWORD}}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  mysql-data:
