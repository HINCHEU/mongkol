<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Midnight Sapphire Royal Navy Gradient (Pailin Jewel Palette) -->
        <radialGradient id="bot-bg" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#1E2B58"/>
            <stop offset="45%" stop-color="#141D3B"/>
            <stop offset="85%" stop-color="#0D1326"/>
            <stop offset="100%" stop-color="#060913"/>
        </radialGradient>

        <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF5D1"/>
            <stop offset="25%" stop-color="#F5DE93"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="75%" stop-color="#A88B4A"/>
            <stop offset="100%" stop-color="#F9E8B2"/>
        </linearGradient>

        <linearGradient id="bot-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#80E9FF"/>
            <stop offset="50%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>

        <filter id="royal-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
        <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Circular Base (Perfect for Telegram Avatar Crop) -->
    <circle cx="256" cy="256" r="256" fill="url(#bot-bg)" />

    <!-- Royal Concentric Gold Rings -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold-leaf)" stroke-width="4.5" opacity="0.9" />
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#gold-leaf)" stroke-width="1.8" stroke-dasharray="5, 8" opacity="0.7" />

    <!-- Assistant Satellite Pulse Nodes (Bot Signals) -->
    <circle cx="98" cy="98" r="5" fill="url(#bot-sparkle)" filter="url(#cyan-glow)" />
    <circle cx="414" cy="98" r="5" fill="url(#bot-sparkle)" filter="url(#cyan-glow)" />
    <circle cx="98" cy="414" r="5" fill="url(#bot-sparkle)" filter="url(#cyan-glow)" />
    <circle cx="414" cy="414" r="5" fill="url(#bot-sparkle)" filter="url(#cyan-glow)" />

    <!-- Sacred Golden Lotus Emblem with Intelligent Assistant Flare -->
    <g transform="translate(256, 245) scale(12) translate(-12, -12)" filter="url(#royal-glow)">
        <!-- Center Petal Translucent Fill -->
        <path d="M12 3c-2.5 3.5-3 8 0 13c3-5 2.5-9.5 0-13Z" fill="url(#gold-leaf)" fill-opacity="0.32" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linejoin="round" />
        
        <!-- Left Flourish Petal -->
        <path d="M12 16c-4.5-.5-8-3.5-9-8c4 .5 7 2.5 9 6" fill="none" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Right Flourish Petal -->
        <path d="M12 16c4.5-.5 8-3.5 9-8c-4 .5-7 2.5-9 6" fill="none" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Sacred Bottom Seed / Core -->
        <circle cx="12" cy="18" r="1.5" fill="url(#gold-leaf)" />
    </g>

    <!-- Digital Assistant Crown / Aura Spark at the top of the lotus -->
    <g transform="translate(256, 126)" filter="url(#cyan-glow)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#bot-sparkle)" />
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Bot Identity Pill at Bottom -->
    <g transform="translate(256, 440)">
        <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#0D1326" stroke="url(#gold-leaf)" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="url(#gold-leaf)" letter-spacing="3">BOT</text>
    </g>
</svg>
