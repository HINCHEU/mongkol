<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Luxury Gradients -->
        <radialGradient id="channel-bg" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#93182B"/>
            <stop offset="45%" stop-color="#7B1122"/>
            <stop offset="85%" stop-color="#4C0A13"/>
            <stop offset="100%" stop-color="#34050C"/>
        </radialGradient>

        <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF5D1"/>
            <stop offset="25%" stop-color="#F5DE93"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="75%" stop-color="#A88B4A"/>
            <stop offset="100%" stop-color="#F9E8B2"/>
        </linearGradient>

        <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE49E"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#8C6D23"/>
        </linearGradient>

        <filter id="royal-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
        <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Circular Base (Perfect for Telegram Avatar Crop) -->
    <circle cx="256" cy="256" r="256" fill="url(#channel-bg)" />

    <!-- Royal Concentric Gold Borders -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold-leaf)" stroke-width="4.5" opacity="0.9" />
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#gold-leaf)" stroke-width="1.8" stroke-dasharray="4, 7" opacity="0.75" />

    <!-- 4 Cardinal Phka Chan Royal Ornaments -->
    <!-- North -->
    <path d="M256 16 L259 23 L266 26 L259 29 L256 36 L253 29 L246 26 L253 23 Z" fill="url(#gold-leaf)" />
    <!-- South -->
    <path d="M256 476 L259 483 L266 486 L259 489 L256 496 L253 489 L246 486 L253 483 Z" fill="url(#gold-leaf)" />
    <!-- West -->
    <path d="M26 246 L33 249 L36 256 L33 263 L26 266 L23 263 L16 256 L23 249 Z" fill="url(#gold-leaf)" />
    <!-- East -->
    <path d="M486 246 L493 249 L496 256 L493 263 L486 266 L483 263 L476 256 L483 249 Z" fill="url(#gold-leaf)" />

    <!-- Sacred Golden Lotus Emblem -->
    <g transform="translate(256, 252) scale(12.5) translate(-12, -12)" filter="url(#royal-glow)">
        <!-- Center Petal Translucent Fill -->
        <path d="M12 3c-2.5 3.5-3 8 0 13c3-5 2.5-9.5 0-13Z" fill="url(#gold-leaf)" fill-opacity="0.32" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linejoin="round" />
        
        <!-- Left Flourish Petal -->
        <path d="M12 16c-4.5-.5-8-3.5-9-8c4 .5 7 2.5 9 6" fill="none" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Right Flourish Petal -->
        <path d="M12 16c4.5-.5 8-3.5 9-8c-4 .5-7 2.5-9 6" fill="none" stroke="url(#gold-leaf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Sacred Bottom Seed / Bead -->
        <circle cx="12" cy="18" r="1.5" fill="url(#gold-leaf)" />
    </g>

    <!-- Subtle Brand Arch Text at Bottom -->
    <g filter="url(#subtle-shadow)" opacity="0.85">
        <text x="256" y="445" text-anchor="middle" font-family="'Playfair Display', serif" font-size="21" font-weight="700" fill="url(#gold-leaf)" letter-spacing="4">MONGKOL</text>
    </g>
</svg>

